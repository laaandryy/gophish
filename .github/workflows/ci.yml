name: CI
on:
  - pull_request
  - push

# The CI only needs to read the repository
permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ["1.24", "1.26", "1.27"]

    steps:
    - name: Set up Go ${{ matrix.goVer }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.goVer }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        go get gopkg.in/check.v1

    - name: Build
      run: go build -v .
    
    - name: Format
      run: diff -u <(echo -n) <(gofmt -d .)
    
    - name: Test
      run: go test ./...

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    # Informational for now: gorilla/csrf 1.6.2 is a known finding that is
    # kept on purpose (upgrading needs trusted_origins behind proxies).
    # Remove this line once it is upgraded so new findings fail the build.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  frontend:
    name: Front-end build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: yarn

    - name: Build assets
      run: |
        yarn install --frozen-lockfile
        yarn build
